<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficios</title>
    <link rel="stylesheet" href="estilos_beneficios.css?v=2">
    <link rel="icon" href="logo.png">
    <link rel="preload" as="image" href="1.jpeg">
</head>

<body>


    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="Logo" width="70" height="70" decoding="async">
            </div>
        </nav>
    </header>



    <div class="container">
        <img class="im" src="1.jpeg" alt="Beneficios" width="827" height="1600" fetchpriority="high" decoding="async">
        <img class="im" src="2.jpeg" alt="Beneficios" width="1080" height="1507" loading="lazy" decoding="async">
        <img class="im" src="3.jpeg" alt="Beneficios" width="1080" height="720" loading="lazy" decoding="async">
        <img class="im" src="4.jpeg" alt="Beneficios" width="660" height="1320" loading="lazy" decoding="async">
        <img class="im" src="5.jpeg" alt="Beneficios" loading="lazy" decoding="async">
        <img class="im" src="6.jpeg" alt="Beneficios" loading="lazy" decoding="async">
        <img class="im" src="7.jpeg" alt="Beneficios" loading="lazy" decoding="async">
        <img class="im" src="8.jpeg" alt="Beneficios" loading="lazy" decoding="async">
    </div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" hidden>
        <span class="lightbox-cerrar" aria-label="Cerrar">&times;</span>
        <img class="lightbox-img" id="lightbox-img" alt="">
    </div>

    <script>
        (function () {
            var lightbox = document.getElementById('lightbox');
            var lightboxImg = document.getElementById('lightbox-img');

            function abrir(src) {
                lightboxImg.src = src;
                lightbox.hidden = false;
                lightbox.classList.add('activo');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function cerrar() {
                lightbox.classList.remove('activo');
                lightbox.hidden = true;
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                lightboxImg.removeAttribute('src');
            }

            document.querySelectorAll('.im').forEach(function (img) {
                img.addEventListener('click', function () {
                    abrir(img.currentSrc || img.src);
                });
            });

            lightbox.addEventListener('click', cerrar);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') cerrar();
            });
        })();
    </script>
</body>

</html>
